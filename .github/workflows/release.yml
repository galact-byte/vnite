name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # node-gyp (via electron-builder install-app-deps) needs distutils, which was
      # removed from Python 3.12 stdlib. Pin 3.11 so native rebuilds work on CI.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Dependencies
        run: |
          pnpm config set msvs_version 2022
          pnpm install --no-frozen-lockfile

      - name: Build & Package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm run build:win -- --publish never

      - name: Find Installer
        id: find-exe
        shell: bash
        run: |
          exe_path=$(ls dist/*-setup.exe 2>/dev/null | head -1)
          if [ -z "$exe_path" ]; then
            echo "ERROR: No setup exe found!"
            ls -la dist/
            exit 1
          fi
          echo "path=${exe_path}" >> $GITHUB_OUTPUT
          echo "name=$(basename "${exe_path}")" >> $GITHUB_OUTPUT

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.find-exe.outputs.path }}
            dist/latest.yml
            dist/*-setup.exe.blockmap
          draft: false
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
